name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify (e.g. v0.3.0, v0.2.3-beta)'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine channel
        id: channel
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          # Use case statement instead of regex to avoid escaping issues
          case "$TAG" in
            *[Bb][Ee][Tt][Aa]*|*[Rr][Cc]*|*[Aa][Ll][Pp][Hh][Aa]*|*[Tt][Ee][Ss][Tt]*)
              echo "url=${{ secrets.DISCORD_WEBHOOK_BETA }}" >> $GITHUB_OUTPUT
              ;;
            v[0-9]*.[0-9]*.[0-9]*|[0-9]*.[0-9]*.[0-9]*)
              # Check if it's a standard version number (vX.Y.Z or X.Y.Z)
              if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "url=${{ secrets.DISCORD_WEBHOOK_STABLE }}" >> $GITHUB_OUTPUT
              else
                echo "url=${{ secrets.DISCORD_WEBHOOK_LEGACY }}" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "url=${{ secrets.DISCORD_WEBHOOK_LEGACY }}" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Fetch release data (manual trigger)
        id: release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.channel.outputs.tag }}"
          RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$TAG)
          BODY=$(echo "$RELEASE" | jq -r '.body // "无更新说明"')
          HTML_URL=$(echo "$RELEASE" | jq -r '.html_url')
          PUBLISHED_AT=$(echo "$RELEASE" | jq -r '.published_at')
          BODY_ESC=$(echo "$BODY" | jq -Rs .)
          echo "body=$BODY_ESC" >> $GITHUB_OUTPUT
          echo "html_url=$HTML_URL" >> $GITHUB_OUTPUT
          echo "published_at=$PUBLISHED_AT" >> $GITHUB_OUTPUT

      - name: Prepare payload
        id: payload
        run: |
          TAG="${{ steps.channel.outputs.tag }}"
          URL="${{ steps.channel.outputs.url }}"
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            BODY="${{ steps.release.outputs.body }}"
            HTML_URL="${{ steps.release.outputs.html_url }}"
            PUBLISHED_AT="${{ steps.release.outputs.published_at }}"
          else
            BODY="${{ github.event.release.body || '无更新说明' }}"
            HTML_URL="${{ github.event.release.html_url }}"
            PUBLISHED_AT="${{ github.event.release.published_at }}"
          fi
          jq -n \
            --arg username "WorldBridge Bot" \
            --arg avatar_url "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png" \
            --arg title "🚀 新版本发布：$TAG" \
            --arg description "$BODY" \
            --arg url "$HTML_URL" \
            --argjson color 5814783 \
            --arg timestamp "$PUBLISHED_AT" \
            --arg footer "WorldBridge Auto-Release" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                timestamp: $timestamp,
                footer: { text: $footer }
              }]
            }' > payload.json
          echo "payload_file=payload.json" >> $GITHUB_OUTPUT

      - name: Send to Discord
        run: |
          curl -X POST "${{ steps.channel.outputs.url }}" \
            -H "Content-Type: application/json" \
            -d @${{ steps.payload.outputs.payload_file }}