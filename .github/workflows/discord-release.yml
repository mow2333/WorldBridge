name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify (e.g. 0.3.0, 0.2.3-beta)'
        required: true
        type: string

permissions:
  contents: read
  variables: write

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      variables: write
    steps:
      - name: Run all logic in Python
        id: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_STABLE: ${{ secrets.DISCORD_WEBHOOK_STABLE }}
          DISCORD_WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          DISCORD_WEBHOOK_LEGACY: ${{ secrets.DISCORD_WEBHOOK_LEGACY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, sys, datetime, urllib.request, urllib.error, json as jsonlib

          # ========== 1. 解析 tag ==========
          event_name = os.getenv('GITHUB_EVENT_NAME')
          input_tag = os.getenv('INPUT_TAG')
          release_tag = os.getenv('RELEASE_TAG')

          tag = os.getenv('INPUT_TAG') or os.getenv('RELEASE_TAG')
          if not tag:
              print("Error: No tag provided", file=sys.stderr)
              sys.exit(1)

          print(f"Resolved tag: {tag}")

          # ---------- 判断频道 ----------
          tag_lower = tag.lower()
          is_beta = any(kw in tag.lower() for kw in ('beta', 'rc', 'alpha', 'test'))
          is_stable = re.match(r'^v?\d+\.\d+\.\d+$', tag) is not None

          if any(kw in tag.lower() for kw in ('beta', 'rc', 'alpha', 'test')):
              channel_name = 'beta'
              webhook_url = os.getenv('DISCORD_WEBHOOK_BETA')
          elif re.match(r'^v?\d+\.\d+\.\d+$', tag):
              webhook_url = os.getenv('DISCORD_WEBHOOK_STABLE')
              channel_name = 'stable'
          else:
              webhook_url = os.getenv('DISCORD_WEBHOOK_LEGACY')
              channel_name = 'legacy'

          print(f"Resolved tag: {tag}")
          print(f"Channel: {channel_name}")

          # ========== GitHub API 准备 ==========
          gh_token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('GITHUB_REPOSITORY')
          gh_token = os.getenv('GITHUB_TOKEN')
          repo = os.getenv('GITHUB_REPOSITORY')

          # ========== 获取 release 信息 ==========
          api_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={
                  'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'WorldBridge-Bot/1.0'
              }
          )

          body = "无更新说明"
          html_url = f"https://github.com/{repo}/releases/tag/{tag}"
          published_at = ""
          assets = []
          has_release = False

          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
                  headers={
                      'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'WorldBridge-Bot/1.0'
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  release_data = json.load(resp)
                  body = release_data.get('body') or "无更新说明"
                  html_url = release_data.get('html_url', html_url)
                  published_at = release_data.get('published_at', '')
                  assets = release_data.get('assets', [])
                  has_release = True
                  print("Found release data")
          except Exception as e:
              print(f"No release found for tag {tag}: {e}")
              published_at = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          if not published_at:
              published_at = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          # ========== 读取旧稳定版 tag（用于归档） ==========
          old_stable_tag = ""
          try:
              var_resp = urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/variables/LATEST_STABLE_TAG",
                      headers={'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                               'Accept': 'application/vnd.github+json',
                               'User-Agent': 'WorldBridge-Bot/1.0'}
                  )
              )
              var_data = json.load(var_resp)
              old_stable_tag = var_data.get('value', '')
              print(f"Old stable tag from variable: {old_stable_tag}")
          except Exception as e:
              print(f"No previous stable tag variable: {e}")

          # ========== 判断频道 ==========
          tag_lower = tag.lower()
          if any(kw in tag.lower() for kw in ('beta', 'rc', 'alpha', 'test')):
              webhook_url = os.getenv('DISCORD_WEBHOOK_BETA')
              channel_name = 'beta'
              is_stable_release = False
          elif re.match(r'^v?\d+\.\d+\.\d+$', tag):
              webhook_url = os.getenv('DISCORD_WEBHOOK_STABLE')
              channel_name = 'stable'
              is_stable_release = True
          else:
              webhook_url = os.getenv('DISCORD_WEBHOOK_LEGACY')
              channel_name = 'legacy'
              is_stable_release = False

          print(f"Resolved tag: {tag}")
          print(f"Channel: {channel_name}")
          print(f"Is stable release: {is_stable_release}")

          # ========== 归档旧稳定版（仅稳定版发布时） ==========
          if is_stable_release and old_stable_tag and old_stable_tag != tag:
              # 发送归档消息到旧版本频道
              archive_url = os.getenv('DISCORD_WEBHOOK_LEGACY')
              archive_payload = {
                  "username": "WorldBridge Bot",
                  "avatar_url": "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png",
                  "embeds": [{
                      "title": "📦 版本归档",
                      "description": f"版本 **{old_stable_tag}** 已归档，最新稳定版现为 **{tag}**。\n原下载链接：https://github.com/{repo}/releases/tag/{old_stable_tag}",
                      "url": f"https://github.com/{repo}/releases/tag/{old_stable_tag}",
                      "color": 10181046,  # 橙色
                      "timestamp": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                      "footer": {"text": "WorldBridge Auto-Archive"}
                  }]
              }
              data = jsonlib.dumps({
                  "username": "WorldBridge Bot",
                  "avatar_url": "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png",
                  "embeds": [{
                      "title": f"📦 版本归档：{old_stable_tag}",
                      "description": f"版本 **{old_stable_tag}** 已归档，最新稳定版现为 **{tag}**。\n原下载链接：https://github.com/{repo}/releases/tag/{old_stable_tag}",
                      "url": f"https://github.com/{repo}/releases/tag/{old_stable_tag}",
                      "color": 10181046,
                      "timestamp": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                      "footer": {"text": "WorldBridge Auto-Archive"}
                  }]
              }).encode('utf-8')
              req = urllib.request.Request(
                  os.getenv('DISCORD_WEBHOOK_LEGACY'),
                  data=jsonlib.dumps({
                      "username": "WorldBridge Bot",
                      "avatar_url": "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png",
                      "embeds": [{
                          "title": f"📦 版本归档：{old_stable_tag}",
                          "description": f"版本 **{old_stable_tag}** 已归档，最新稳定版现为 **{tag}**。\n原下载链接：https://github.com/{repo}/releases/tag/{old_stable_tag}",
                          "url": f"https://github.com/{repo}/releases/tag/{old_stable_tag}",
                          "color": 10181046,
                          "timestamp": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                          "footer": {"text": "WorldBridge Auto-Archive"}
                      }]
                  }).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'WorldBridge-Bot/1.0'}
              )
              with urllib.request.urlopen(req) as resp:
                  print(f"Archive message sent: {resp.status}")

          # ========== 发布新版本消息 ==========
          if not published_at:
              published_at = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')

          body_text = body if 'body' in locals() and body else "无更新说明"
          if 'has_release' not in locals() or not has_release:
              body_text = "该标签暂无 Release 详情（可能是裸标签），请前往 GitHub 查看详情。"

          # 构建下载按钮
          components = []
          if 'assets' in locals() and assets:
              for asset in assets:
                  components.append({
                      "type": 2,
                      "style": 5,  # Link button
                      "label": f"下载 {asset['name']}",
                      "url": asset['browser_download_url']
                  })

          # Discord embed + components
          payload = {
              "username": "WorldBridge Bot",
              "avatar_url": "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png",
              "embeds": [{
                  "title": f"🚀 新版本发布：{tag}",
                  "description": body_text,
                  "url": html_url,
                  "color": 5814783,
                  "timestamp": published_at if published_at else datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                  "footer": {"text": "WorldBridge Auto-Release"}
              }]
          }

          # Add components if there are assets
          if 'assets' in locals() and assets:
              payload["components"] = [{"type": 1, "components": [
                  {"type": 2, "style": 5, "label": f"下载 {asset['name']}", "url": asset['browser_download_url']}
                  for asset in assets
              ]}]

          # ========== 发送到 Discord ==========
          if channel_name == 'beta':
              webhook_url = os.getenv('DISCORD_WEBHOOK_BETA')
          elif channel_name == 'stable':
              webhook_url = os.getenv('DISCORD_WEBHOOK_STABLE')
          else:
              webhook_url = os.getenv('DISCORD_WEBHOOK_LEGACY')

          print(f"Channel: {channel_name}")
          print(f"Sending to {channel_name} channel...")

          data = jsonlib.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              webhook_url,
              data=jsonlib.dumps(payload).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'User-Agent': 'WorldBridge-Bot/1.0'
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord response: {resp.status}")
          except urllib.error.HTTPError as e:
              print(f"Discord error: {e.code} - {e.read().decode()}")
              sys.exit(1)

          # ========== 更新 LATEST_STABLE_TAG 变量 ==========
          if is_stable_release:
              try:
                  var_payload = jsonlib.dumps({"value": tag}).encode('utf-8')
                  var_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/variables/LATEST_STABLE_TAG",
                      data=jsonlib.dumps({"value": tag}).encode('utf-8'),
                      headers={
                          'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                          'Accept': 'application/vnd.github+json',
                          'Content-Type': 'application/json',
                          'User-Agent': 'WorldBridge-Bot/1.0'
                      },
                      method='PATCH'
                  )
                  # Try PATCH first (update), if 404 then POST (create)
                  try:
                      with urllib.request.urlopen(urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/variables/LATEST_STABLE_TAG",
                          data=jsonlib.dumps({"value": tag}).encode('utf-8'),
                          headers={
                              'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                              'Accept': 'application/vnd.github+json',
                              'Content-Type': 'application/json',
                              'User-Agent': 'WorldBridge-Bot/1.0'
                          },
                          method='PATCH'
                      )) as resp:
                          print(f"Updated variable: {resp.status}")
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          # Create new variable
                          with urllib.request.urlopen(urllib.request.Request(
                              f"https://api.github.com/repos/{repo}/variables",
                              data=jsonlib.dumps({"name": "LATEST_STABLE_TAG", "value": tag}).encode('utf-8'),
                              headers={
                                  'Authorization': f'Bearer {os.getenv("GITHUB_TOKEN")}',
                                  'Accept': 'application/vnd.github+json',
                                  'Content-Type': 'application/json',
                                  'User-Agent': 'WorldBridge-Bot/1.0'
                              },
                              method='POST'
                          )) as resp:
                              print(f"Created variable: {resp.status}")
                      else:
                          raise
                  print(f"Updated LATEST_STABLE_TAG to {tag}")
              except Exception as e:
                  print(f"Failed to update variable: {e}")

          print("Done!")
          PYEOF