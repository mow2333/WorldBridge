name: Discord Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to notify (e.g. v0.3.0, v0.2.3-beta)'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine channel and tag
        id: channel
        run: |
          python3 << 'PYEOF'
          import os, re, sys

          tag = os.getenv('INPUT_TAG') or os.getenv('GITHUB_REF_NAME', '')
          # Determine channel
          tag_lower = tag.lower()
          if any(kw in tag_lower for kw in ('beta', 'rc', 'alpha', 'test')):
              url = os.getenv('DISCORD_WEBHOOK_BETA')
          elif re.match(r'^v?\d+\.\d+\.\d+$', tag):
              url = os.getenv('DISCORD_WEBHOOK_STABLE')
          else:
              url = os.getenv('DISCORD_WEBHOOK_LEGACY')

          print(f"url={url}")
          print(f"tag={tag}")
          PYEOF
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
          DISCORD_WEBHOOK_STABLE: ${{ secrets.DISCORD_WEBHOOK_STABLE }}
          DISCORD_WEBHOOK_BETA: ${{ secrets.DISCORD_WEBHOOK_BETA }}
          DISCORD_WEBHOOK_LEGACY: ${{ secrets.DISCORD_WEBHOOK_LEGACY }}

      - name: Fetch release data (manual trigger)
        id: release
        if: github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.channel.outputs.tag }}"
          RELEASE=$(gh api repos/${{ github.repository }}/releases/tags/$TAG)
          BODY=$(echo "$RELEASE" | jq -r '.body // "无更新说明"')
          HTML_URL=$(echo "$RELEASE" | jq -r '.html_url')
          PUBLISHED_AT=$(echo "$RELEASE" | jq -r '.published_at')
          BODY_ESC=$(echo "$BODY" | jq -Rs .)
          echo "body=$BODY_ESC" >> $GITHUB_OUTPUT
          echo "html_url=$HTML_URL" >> $GITHUB_OUTPUT
          echo "published_at=$PUBLISHED_AT" >> $GITHUB_OUTPUT

      - name: Prepare payload
        id: payload
        run: |
          TAG="${{ steps.channel.outputs.tag }}"
          URL="${{ steps.channel.outputs.url }}"
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            BODY="${{ steps.release.outputs.body }}"
            HTML_URL="${{ steps.release.outputs.html_url }}"
            PUBLISHED_AT="${{ steps.release.outputs.published_at }}"
          else
            BODY="${{ github.event.release.body || '无更新说明' }}"
            HTML_URL="${{ github.event.release.html_url }}"
            PUBLISHED_AT="${{ github.event.release.published_at }}"
          fi
          jq -n \
            --arg username "WorldBridge Bot" \
            --arg avatar_url "https://raw.githubusercontent.com/mow2333/WorldBridge/master/icon.png" \
            --arg title "🚀 新版本发布：$TAG" \
            --arg description "$BODY" \
            --arg url "$HTML_URL" \
            --argjson color 5814783 \
            --arg timestamp "$PUBLISHED_AT" \
            --arg footer "WorldBridge Auto-Release" \
            '{
              username: $username,
              avatar_url: $avatar_url,
              embeds: [{
                title: $title,
                description: $description,
                url: $url,
                color: $color,
                timestamp: $timestamp,
                footer: { text: $footer }
              }]
            }' > payload.json
          echo "payload_file=payload.json" >> $GITHUB_OUTPUT

      - name: Send to Discord
        run: |
          curl -X POST "${{ steps.channel.outputs.url }}" \
            -H "Content-Type: application/json" \
            -d @${{ steps.payload.outputs.payload_file }}